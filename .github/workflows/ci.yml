name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-tests-and-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/orla-ci-venv"
          echo "ORLA_CI_PYTHON=$RUNNER_TEMP/orla-ci-venv/bin/python" >> "$GITHUB_ENV"

      - name: Install QtDBus test runtime
        run: $ORLA_CI_PYTHON -m pip install --disable-pip-version-check PySide6-Essentials==6.12.0

      - name: Install offscreen Qt GUI library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1

      - name: Verify private D-Bus runner
        run: command -v dbus-run-session

      - name: Run portable tests
        run: |
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_integrations.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_package_cli.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_themes.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_release.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_updates.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_steam.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_ai.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_ai_text.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_ai_text_transport.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_ai_text_ollama.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s launcher/tests -p 'test_package.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_profiles.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Fusion $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_contexts.py' -v

      - name: Run portable theme parser and appearance consumer checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          PYTHONPATH: tests
        run: |
          $ORLA_CI_PYTHON -B -m unittest test_theme_consumer -v
          $ORLA_CI_PYTHON -B -m unittest \
            test_appearance.AppearanceTests.test_theme_preview_preserves_base_and_only_apply_saves_normalized_tokens \
            test_appearance.AppearanceTests.test_theme_controls_use_keyboard_plain_text_and_tab_leaves_input \
            test_appearance.AppearanceTests.test_invalid_or_pending_theme_keeps_last_preview_and_clear_recovers \
            test_appearance.AppearanceTests.test_theme_error_focus_and_oversized_text_preserve_controls_at_420_pixels \
            test_appearance.AppearanceTests.test_stale_theme_preview_and_apply_do_not_change_saved_bytes -v

      - name: Run optional menu mock tests
        run: $ORLA_CI_PYTHON bar/run_tests.py

      - name: Run portable audio state checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          PYTHONPATH: tests
        run: $ORLA_CI_PYTHON -B -m unittest test_audio_control -v

      - name: Run portable local event state checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          PYTHONPATH: tests
        run: $ORLA_CI_PYTHON -B -m unittest test_event_state -v

      - name: Build release bundle and checksums
        run: $ORLA_CI_PYTHON scripts/release.py

      - name: Upload package artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: orla-dock-plasmoid
          path: |
            dist/orla-dock-*.plasmoid
            dist/orla-dock-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  launcher-build-and-ctest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora@sha256:1b8544582f974533fb8d9a5d6bf6dc2caf0d977ea54979d5e864a6ffd345c32e
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - name: Install pinned launcher build dependencies
        run: |
          set -euo pipefail
          packages=(
            'cmake-0:4.3.0-1.fc44.x86_64'
            'dbus-daemon-1:1.16.2-1.fc44.x86_64'
            'gcc-c++-0:16.2.1-2.fc44.x86_64'
            'gdb-0:17.2-4.fc44.x86_64'
            'git-0:2.56.0-1.fc44.x86_64'
            'glib2-0:2.88.3-1.fc44.x86_64'
            'kf6-kconfig-devel-0:6.30.0-1.fc44.x86_64'
            'kf6-kglobalaccel-devel-0:6.30.0-1.fc44.x86_64'
            'kf6-krunner-devel-0:6.30.0-1.fc44.x86_64'
            'kf6-kwindowsystem-devel-0:6.30.0-1.fc44.x86_64'
            'ninja-build-0:1.13.2-2.fc44.x86_64'
            'plasma-workspace-libs-0:6.7.5-1.fc44.x86_64'
            'python3-0:3.14.8-1.fc44.x86_64'
            'qt6-qtbase-devel-0:6.11.2-3.fc44.x86_64'
            'qt6-qtdeclarative-devel-0:6.11.2-2.fc44.x86_64'
          )
          expected=(
            'cmake|0:4.3.0-1.fc44|x86_64|fedora'
            'dbus-daemon|1:1.16.2-1.fc44|x86_64|fedora'
            'gcc-c++|0:16.2.1-2.fc44|x86_64|updates'
            'gdb|0:17.2-4.fc44|x86_64|updates'
            'git|0:2.56.0-1.fc44|x86_64|updates'
            'glib2|0:2.88.3-1.fc44|x86_64|updates'
            'kf6-kconfig-devel|0:6.30.0-1.fc44|x86_64|updates'
            'kf6-kglobalaccel-devel|0:6.30.0-1.fc44|x86_64|updates'
            'kf6-krunner-devel|0:6.30.0-1.fc44|x86_64|updates'
            'kf6-kwindowsystem-devel|0:6.30.0-1.fc44|x86_64|updates'
            'ninja-build|0:1.13.2-2.fc44|x86_64|fedora'
            'plasma-workspace-libs|0:6.7.5-1.fc44|x86_64|updates'
            'python3|0:3.14.8-1.fc44|x86_64|updates'
            'qt6-qtbase-devel|0:6.11.2-3.fc44|x86_64|updates'
            'qt6-qtdeclarative-devel|0:6.11.2-2.fc44|x86_64|updates'
          )

          for index in "${!packages[@]}"; do
            resolved=$(dnf5 --quiet repoquery --available \
              --qf '%{name}|%{epoch}:%{version}-%{release}|%{arch}|%{repoid}' \
              "${packages[$index]}")
            if [[ "$resolved" != "${expected[$index]}" ]]; then
              printf 'Unexpected Fedora package for %s\nexpected: %s\nresolved: %s\n' \
                "${packages[$index]}" "${expected[$index]}" "$resolved" >&2
              exit 1
            fi
          done

          dnf5 install -y --setopt=install_weak_deps=False "${packages[@]}"

          for index in "${!packages[@]}"; do
            name=${expected[$index]%%|*}
            installed=$(rpm -q --qf '%{NAME}|%{EPOCHNUM}:%{VERSION}-%{RELEASE}|%{ARCH}\n' "$name")
            expected_installed=${expected[$index]%|*}
            if [[ "$installed" != "$expected_installed" ]]; then
              printf 'Unexpected installed package for %s\nexpected: %s\ninstalled: %s\n' \
                "$name" "$expected_installed" "$installed" >&2
              exit 1
            fi
          done

          command -v dbus-daemon
          command -v gdbus
          test -f /usr/lib64/qt6/plugins/kf6/krunner/krunner_services.so
          test -f /usr/lib64/qt6/plugins/kf6/krunner/calculator.so
          rpm -q --whatprovides /usr/lib64/qt6/plugins/kf6/krunner/krunner_services.so
          rpm -q --whatprovides /usr/lib64/qt6/plugins/kf6/krunner/calculator.so
          cmake --version
          python3 --version

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure launcher
        run: |
          cmake -S launcher -B "$RUNNER_TEMP/orla-launcher-build" \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPython3_EXECUTABLE=/usr/bin/python3

      - name: Build launcher and test binaries
        run: cmake --build "$RUNNER_TEMP/orla-launcher-build" --parallel 2

      - name: Verify launcher CTest inventory
        run: |
          ctest --test-dir "$RUNNER_TEMP/orla-launcher-build" \
            --show-only=json-v1 > "$RUNNER_TEMP/orla-launcher-ctests.json"
          python3 - "$RUNNER_TEMP/orla-launcher-ctests.json" <<'PY'
          import json
          import pathlib
          import sys

          expected = {
              "launcher-ai-provider",
              "launcher-ai-text",
              "launcher-behavior",
              "launcher-owned-app",
              "launcher-steam-provider",
              "launcher-ui",
          }
          document = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          tests = document.get("tests")
          if not isinstance(tests, list):
              raise SystemExit("CTest JSON does not contain a tests list")
          names = [test.get("name") for test in tests if isinstance(test, dict)]
          if len(names) != len(expected) or set(names) != expected:
              raise SystemExit(f"unexpected CTest inventory: {names!r}")
          print("Verified launcher CTests:", ", ".join(sorted(names)))
          PY

      - name: Run launcher CTests with private fixtures
        id: launcher_ctests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
        run: |
          ctest --test-dir "$RUNNER_TEMP/orla-launcher-build" \
            --output-on-failure --no-tests=error

      - name: Diagnose failed launcher UI without changing its result
        if: ${{ failure() && steps.launcher_ctests.outcome == 'failure' }}
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          DEBUGINFOD_URLS: ""
        run: |
          set -euo pipefail
          failed="$RUNNER_TEMP/orla-launcher-build/Testing/Temporary/LastTestsFailed.log"
          if [[ ! -f "$failed" ]] || ! grep -Eq '^[0-9]+:launcher-ui$' "$failed"; then
            exit 0
          fi
          # This one diagnostic run cannot turn the original failed step green.
          python3 launcher/tests/run_isolated.py --private-path \
            /usr/bin/gdb --nx --nh --batch --return-child-result \
            -iex 'set auto-load off' \
            -iex 'set debuginfod enabled off' \
            -ex 'set pagination off' \
            -ex 'set disable-randomization off' \
            -ex 'set startup-with-shell off' \
            -ex run -ex 'thread apply all bt 40' -ex 'info sharedlibrary' \
            --args "$RUNNER_TEMP/orla-launcher-build/orla-launcher-ui-tests"
