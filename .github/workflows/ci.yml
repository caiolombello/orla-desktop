name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-tests-and-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/orla-ci-venv"
          echo "ORLA_CI_PYTHON=$RUNNER_TEMP/orla-ci-venv/bin/python" >> "$GITHUB_ENV"

      - name: Install QtDBus test runtime
        run: $ORLA_CI_PYTHON -m pip install --disable-pip-version-check PySide6-Essentials==6.12.0

      - name: Install offscreen Qt GUI library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 dbus-daemon libglib2.0-bin

      - name: Verify private D-Bus runner
        run: command -v dbus-run-session

      - name: Verify passive update desktop with isolated user state
        run: |
          umask 077
          ORLA_UPDATES_TEST_ROOT="$RUNNER_TEMP/orla-updates-tests"
          mkdir -p "$ORLA_UPDATES_TEST_ROOT"/{home,config,cache,data,state,runtime,tmp}
          export HOME="$ORLA_UPDATES_TEST_ROOT/home"
          export XDG_CONFIG_HOME="$ORLA_UPDATES_TEST_ROOT/config" XDG_CACHE_HOME="$ORLA_UPDATES_TEST_ROOT/cache"
          export XDG_DATA_HOME="$ORLA_UPDATES_TEST_ROOT/data" XDG_RUNTIME_DIR="$ORLA_UPDATES_TEST_ROOT/runtime"
          export XDG_STATE_HOME="$ORLA_UPDATES_TEST_ROOT/state"
          export TMPDIR="$ORLA_UPDATES_TEST_ROOT/tmp" PYTHONPATH=tests
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$ORLA_UPDATES_TEST_ROOT/absent-session"
          export DBUS_SYSTEM_BUS_ADDRESS="unix:path=$ORLA_UPDATES_TEST_ROOT/absent-system"
          unset DISPLAY WAYLAND_DISPLAY AT_SPI_BUS_ADDRESS SESSION_MANAGER
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Fusion $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_updates_desktop*.py' -v

      - name: Run portable addon SDK, service and installer tests with isolated user state
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ORLA_ADDONS_TEST_ROOT=$(mktemp -d "$RUNNER_TEMP/orla-addons-tests.XXXXXX")
          trap 'rm -rf -- "$ORLA_ADDONS_TEST_ROOT"' EXIT
          mkdir -p "$ORLA_ADDONS_TEST_ROOT"/{home,config,cache,data,state,runtime,tmp}
          timeout --signal=TERM --kill-after=10s 180s env -i \
            PATH=/usr/bin:/bin \
            HOME="$ORLA_ADDONS_TEST_ROOT/home" \
            XDG_CONFIG_HOME="$ORLA_ADDONS_TEST_ROOT/config" \
            XDG_CONFIG_DIRS="$ORLA_ADDONS_TEST_ROOT/config" \
            XDG_CACHE_HOME="$ORLA_ADDONS_TEST_ROOT/cache" \
            XDG_DATA_HOME="$ORLA_ADDONS_TEST_ROOT/data" \
            XDG_DATA_DIRS="$ORLA_ADDONS_TEST_ROOT/data" \
            XDG_STATE_HOME="$ORLA_ADDONS_TEST_ROOT/state" \
            XDG_RUNTIME_DIR="$ORLA_ADDONS_TEST_ROOT/runtime" \
            TMPDIR="$ORLA_ADDONS_TEST_ROOT/tmp" TMP="$ORLA_ADDONS_TEST_ROOT/tmp" TEMP="$ORLA_ADDONS_TEST_ROOT/tmp" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$ORLA_ADDONS_TEST_ROOT/absent-session" \
            DBUS_SYSTEM_BUS_ADDRESS="unix:path=$ORLA_ADDONS_TEST_ROOT/absent-system" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Fusion \
            QT_QPA_PLATFORMTHEME= PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            PYTHONPATH="$PWD:$PWD/tests" \
            "$ORLA_CI_PYTHON" -B -s -m unittest \
              test_addons test_addon_store test_addon_worker test_addon_service test_package_cli -v

      - name: Run portable tests
        run: |
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_integrations.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_package_cli.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_search_shortcut.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_panel_layout*.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Fusion $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_workspace*.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_themes.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_theme_file.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_theme_service.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_release.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_updates.py' -v
          $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_steam.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_ai.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_ai_text.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_ai_text_transport.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_ai_text_ollama.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s launcher/tests -p 'test_package.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s launcher/tests -p 'test_inventory_policy.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s launcher/tests -p 'test_inventory_host*.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s launcher/tests -p 'test_install*.py' -v
          $ORLA_CI_PYTHON -B -m unittest discover -s launcher/tests -p 'test_artifact*.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_profiles.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_task_drag_state.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Fusion $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_contexts.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Fusion $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_auto_context_profiles.py' -v
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Fusion $ORLA_CI_PYTHON -m unittest discover -s tests -p 'test_desktop_switch.py' -v

      - name: Check the design system
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ORLA_CI_PYTHON -B scripts/design.py check
          $ORLA_CI_PYTHON -B -m unittest discover -s tests -p 'test_design_system.py' -v

      - name: Run portable theme parser and appearance consumer checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          PYTHONPATH: tests
        run: |
          $ORLA_CI_PYTHON -B -m unittest test_theme_consumer test_theme_file_state test_theme_file_picker test_appearance_preset_parser test_appearance_preset test_local_modules test_integration_state -v
          $ORLA_CI_PYTHON -B -m unittest \
            test_appearance.AppearanceTests.test_collapsed_advanced_skips_technical_fields_and_common_preview_cancels \
            test_appearance.AppearanceTests.test_keyboard_expands_and_collapsing_focused_color_returns_to_disclosure \
            test_appearance.AppearanceTests.test_theme_validation_reveals_collapsed_advanced_without_losing_invalid_text \
            test_appearance.AppearanceTests.test_pending_theme_and_invalid_color_stay_recoverable_until_cleared \
            test_appearance.AppearanceTests.test_apply_undo_preserve_disclosure_and_reopening_resets_it \
            test_appearance.AppearanceTests.test_theme_preview_preserves_base_and_only_apply_saves_normalized_tokens \
            test_appearance.AppearanceTests.test_theme_controls_use_keyboard_plain_text_and_tab_leaves_input \
            test_appearance.AppearanceTests.test_invalid_or_pending_theme_keeps_last_preview_and_clear_recovers \
            test_appearance.AppearanceTests.test_theme_error_focus_and_oversized_text_preserve_controls_at_420_pixels \
            test_appearance.AppearanceTests.test_stale_theme_preview_and_apply_do_not_change_saved_bytes -v

      - name: Run optional menu mock tests
        run: $ORLA_CI_PYTHON bar/run_tests.py

      - name: Run portable audio state checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          PYTHONPATH: tests
        run: $ORLA_CI_PYTHON -B -m unittest test_audio_control -v

      - name: Run portable shared Control Center routing and lifecycle checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          PYTHONPATH: tests
        run: $ORLA_CI_PYTHON -B -m unittest test_shared_control_center_registry test_control_center_session -v

      - name: Run portable local event state checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          PYTHONPATH: tests
        run: $ORLA_CI_PYTHON -B -m unittest test_event_state -v

      - name: Build release bundle and checksums
        run: $ORLA_CI_PYTHON scripts/release.py

      - name: Upload package artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: orla-dock-plasmoid
          path: |
            dist/orla-dock-*.plasmoid
            dist/orla-dock-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  launcher-build-and-ctest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ORLA_LAUNCHER_CI_ROOT: /tmp/orla-launcher-ci-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: registry.fedoraproject.org/fedora@sha256:1b8544582f974533fb8d9a5d6bf6dc2caf0d977ea54979d5e864a6ffd345c32e
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - name: Install pinned launcher build dependencies
        run: |
          set -euo pipefail
          packages=(
            'bubblewrap-0:0.12.0-1.fc44.x86_64'
            'cmake-0:4.3.0-1.fc44.x86_64'
            'dbus-daemon-1:1.16.2-1.fc44.x86_64'
            'gcc-c++-0:16.2.1-2.fc44.x86_64'
            'gdb-0:17.2-4.fc44.x86_64'
            'git-0:2.56.0-1.fc44.x86_64'
            'glib2-0:2.88.4-1.fc44.x86_64'
            'kf6-kconfig-devel-0:6.31.0-1.fc44.x86_64'
            'kf6-kglobalaccel-devel-0:6.31.0-1.fc44.x86_64'
            'kf6-krunner-devel-0:6.31.0-1.fc44.x86_64'
            'kf6-kservice-devel-0:6.31.0-1.fc44.x86_64'
            'kf6-kwindowsystem-devel-0:6.31.0-1.fc44.x86_64'
            'ninja-build-0:1.13.2-2.fc44.x86_64'
            'plasma-workspace-libs-0:6.7.5-1.fc44.x86_64'
            'python3-0:3.14.8-1.fc44.x86_64'
            'qt6-qtbase-devel-0:6.11.2-3.fc44.x86_64'
            'qt6-qtdeclarative-devel-0:6.11.2-2.fc44.x86_64'
          )
          expected=(
            'bubblewrap|0:0.12.0-1.fc44|x86_64|updates'
            'cmake|0:4.3.0-1.fc44|x86_64|fedora'
            'dbus-daemon|1:1.16.2-1.fc44|x86_64|fedora'
            'gcc-c++|0:16.2.1-2.fc44|x86_64|updates'
            'gdb|0:17.2-4.fc44|x86_64|updates'
            'git|0:2.56.0-1.fc44|x86_64|updates'
            'glib2|0:2.88.4-1.fc44|x86_64|updates'
            'kf6-kconfig-devel|0:6.31.0-1.fc44|x86_64|updates'
            'kf6-kglobalaccel-devel|0:6.31.0-1.fc44|x86_64|updates'
            'kf6-krunner-devel|0:6.31.0-1.fc44|x86_64|updates'
            'kf6-kservice-devel|0:6.31.0-1.fc44|x86_64|updates'
            'kf6-kwindowsystem-devel|0:6.31.0-1.fc44|x86_64|updates'
            'ninja-build|0:1.13.2-2.fc44|x86_64|fedora'
            'plasma-workspace-libs|0:6.7.5-1.fc44|x86_64|updates'
            'python3|0:3.14.8-1.fc44|x86_64|updates'
            'qt6-qtbase-devel|0:6.11.2-3.fc44|x86_64|updates'
            'qt6-qtdeclarative-devel|0:6.11.2-2.fc44|x86_64|updates'
          )

          for index in "${!packages[@]}"; do
            resolved=$(dnf5 --quiet repoquery --available \
              --qf '%{name}|%{epoch}:%{version}-%{release}|%{arch}|%{repoid}' \
              "${packages[$index]}")
            if [[ "$resolved" != "${expected[$index]}" ]]; then
              printf 'Unexpected Fedora package for %s\nexpected: %s\nresolved: %s\n' \
                "${packages[$index]}" "${expected[$index]}" "$resolved" >&2
              exit 1
            fi
          done

          dnf5 install -y --setopt=install_weak_deps=False "${packages[@]}"

          for index in "${!packages[@]}"; do
            name=${expected[$index]%%|*}
            installed=$(rpm -q --qf '%{NAME}|%{EPOCHNUM}:%{VERSION}-%{RELEASE}|%{ARCH}\n' "$name")
            expected_installed=${expected[$index]%|*}
            if [[ "$installed" != "$expected_installed" ]]; then
              printf 'Unexpected installed package for %s\nexpected: %s\ninstalled: %s\n' \
                "$name" "$expected_installed" "$installed" >&2
              exit 1
            fi
          done

          command -v dbus-daemon
          command -v gdbus
          test -f /usr/bin/bwrap
          test -f /usr/lib64/qt6/qml/QtQuick/Controls/Fusion/Button.qml
          rpm -q --whatprovides /usr/bin/bwrap
          rpm -q --whatprovides /usr/lib64/qt6/qml/QtQuick/Controls/Fusion/Button.qml
          test -f /usr/lib64/qt6/plugins/kf6/krunner/krunner_services.so
          test -f /usr/lib64/qt6/plugins/kf6/krunner/calculator.so
          rpm -q --whatprovides /usr/lib64/qt6/plugins/kf6/krunner/krunner_services.so
          rpm -q --whatprovides /usr/lib64/qt6/plugins/kf6/krunner/calculator.so
          cmake --version
          python3 --version

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare private launcher workspace
        run: |
          set -euo pipefail
          test ! -e "$ORLA_LAUNCHER_CI_ROOT"
          mkdir -m 700 "$ORLA_LAUNCHER_CI_ROOT"
          mkdir -m 700 "$ORLA_LAUNCHER_CI_ROOT/tmp"
          # Keep user-install parent guards; container mounts may have another UID.
          git -c safe.directory="$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE/.git" \
            clone --no-hardlinks --no-checkout -- "$GITHUB_WORKSPACE" "$ORLA_LAUNCHER_CI_ROOT/source"
          git -C "$ORLA_LAUNCHER_CI_ROOT/source" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$ORLA_LAUNCHER_CI_ROOT/source" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Configure launcher
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
        run: |
          cmake -S launcher -B "$ORLA_LAUNCHER_CI_ROOT/build" \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPython3_EXECUTABLE=/usr/bin/python3

      - name: Build launcher and test binaries
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
        run: cmake --build "$ORLA_LAUNCHER_CI_ROOT/build" --parallel 2

      - name: Verify isolated test partition selection
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
        run: python3 -B -m unittest discover -s launcher/tests -p 'test_run_isolated.py' -v

      - name: Verify launcher CTest inventory
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
        run: |
          ctest --test-dir "$ORLA_LAUNCHER_CI_ROOT/build" \
            --show-only=json-v1 > "$ORLA_LAUNCHER_CI_ROOT/ctests.json"
          python3 - "$ORLA_LAUNCHER_CI_ROOT/ctests.json" <<'PY'
          import json
          import pathlib
          import sys

          expected = {
              "launcher-ai-provider",
              "launcher-ai-text",
              "launcher-behavior",
              "launcher-favorites-store",
              "launcher-owned-app",
              "launcher-steam-provider",
              "launcher-shortcuts",
              "launcher-ui",
              "launcher-ui-actions",
          }
          document = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          tests = document.get("tests")
          if not isinstance(tests, list):
              raise SystemExit("CTest JSON does not contain a tests list")
          names = [test.get("name") for test in tests if isinstance(test, dict)]
          if len(names) != len(expected) or set(names) != expected:
              raise SystemExit(f"unexpected CTest inventory: {names!r}")
          print("Verified launcher CTests:", ", ".join(sorted(names)))
          PY

      - name: Run launcher CTests with private fixtures
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        id: launcher_ctests
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
        run: |
          ctest --test-dir "$ORLA_LAUNCHER_CI_ROOT/build" \
            --output-on-failure --no-tests=error

      - name: Stage launcher after successful CTests
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
        run: |
          set -euo pipefail
          cmake --install "$ORLA_LAUNCHER_CI_ROOT/build" \
            --prefix "$ORLA_LAUNCHER_CI_ROOT/stage"

      - name: Produce coupled experimental launcher bundle
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        id: launcher_bundle
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("package/metadata.json").read_text(encoding="utf-8"))["KPlugin"]["Version"]
          if not isinstance(value, str):
              raise SystemExit("KPlugin.Version must be a string")
          print(value)
          PY
          )
          # artifact.py must bind clean tracked Source, HEAD and final host/stage pins.
          python3 -B launcher/artifact.py produce \
            --stage "$ORLA_LAUNCHER_CI_ROOT/stage" \
            --output "$ORLA_LAUNCHER_CI_ROOT/bundle" \
            --version "$version" --commit "$GITHUB_SHA" \
            --ci-image-digest 'sha256:1b8544582f974533fb8d9a5d6bf6dc2caf0d977ea54979d5e864a6ffd345c32e' \
            --controls-data /usr/lib64/qt6/qml/QtQuick/Controls/Fusion/Button.qml
          printf 'archive=orla-launcher-%s-%s.zip\n' "$version" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify coupled launcher bundle
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
        run: python3 -B launcher/artifact.py verify --bundle "$ORLA_LAUNCHER_CI_ROOT/bundle"

      - name: Smoke standalone installation without executing launcher
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
        run: python3 -B launcher/artifact.py smoke --bundle "$ORLA_LAUNCHER_CI_ROOT/bundle"

      - name: Upload experimental launcher bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: orla-launcher-fedora44-x86_64-experimental
          path: |
            ${{ env.ORLA_LAUNCHER_CI_ROOT }}/bundle/${{ steps.launcher_bundle.outputs.archive }}
            ${{ env.ORLA_LAUNCHER_CI_ROOT }}/bundle/orla-launcher-bootstrap.zip
            ${{ env.ORLA_LAUNCHER_CI_ROOT }}/bundle/runtime-inventory.json
            ${{ env.ORLA_LAUNCHER_CI_ROOT }}/bundle/observations.json
            ${{ env.ORLA_LAUNCHER_CI_ROOT }}/bundle/artifact.json
            ${{ env.ORLA_LAUNCHER_CI_ROOT }}/bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose failed launcher test without changing its result
        working-directory: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/source
        if: ${{ failure() && steps.launcher_ctests.outcome == 'failure' }}
        timeout-minutes: 2
        env:
          TMPDIR: ${{ env.ORLA_LAUNCHER_CI_ROOT }}/tmp
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          QT_QPA_PLATFORMTHEME: ""
          DEBUGINFOD_URLS: ""
        run: |
          set -euo pipefail
          failed="$ORLA_LAUNCHER_CI_ROOT/build/Testing/Temporary/LastTestsFailed.log"
          target=""
          if [[ -f "$failed" ]]; then
            if grep -Eq '^[0-9]+:launcher-behavior$' "$failed"; then
              target="launcher-behavior"
            elif grep -Eq '^[0-9]+:launcher-ui$' "$failed"; then
              target="launcher-ui"
            fi
          fi
          case "$target" in
            launcher-behavior)
              binary="orla-launcher-tests"
              isolation_flags=()
              ;;
            launcher-ui)
              binary="orla-launcher-ui-tests"
              isolation_flags=(--private-path)
              ;;
            *)
              printf 'No supported failed launcher test in LastTestsFailed.log\n'
              exit 0
              ;;
          esac
          printf 'Diagnosing %s only (priority: launcher-behavior before launcher-ui)\n' "$target"
          # This one diagnostic run cannot turn the original failed step green.
          python3 launcher/tests/run_isolated.py "${isolation_flags[@]}" \
            /usr/bin/gdb --nx --nh --batch --return-child-result \
            -iex 'set auto-load off' \
            -iex 'set debuginfod enabled off' \
            -ex 'set pagination off' \
            -ex 'set disable-randomization off' \
            -ex 'set startup-with-shell off' \
            -ex run -ex 'thread apply all bt 40' -ex 'info sharedlibrary' \
            --args "$ORLA_LAUNCHER_CI_ROOT/build/$binary"
